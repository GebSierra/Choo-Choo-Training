<!doctype html>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body{width:1200px;height:630px;margin:0;overflow:hidden;display:grid;grid-template-columns:1fr 340px;align-items:center;gap:40px;padding:0 70px 0 80px;box-sizing:border-box;
    background:radial-gradient(90% 90% at 85% 0%,#2C2275 0%,transparent 60%),var(--night)}
  .brand{display:flex;align-items:center;gap:14px;font:400 30px var(--display);color:var(--gold);margin-bottom:26px}
  h1{font-size:74px;color:var(--star)} h1 span{color:var(--gold)}
  .free{display:inline-block;margin-top:30px;background:var(--gold);color:var(--night);font:800 26px var(--body);padding:14px 26px;border-radius:14px;box-shadow:0 5px 0 var(--gold-deep)}
  .art{position:relative;height:630px}
  .art .shot{position:absolute;top:60px;right:0;width:270px;border-radius:30px;box-shadow:0 0 0 8px var(--night-2),0 30px 60px -20px #000}
  .art .pip{position:absolute;left:-20px;bottom:40px;height:210px;width:auto}
</style>
<div>
  <div class="brand"><img src="../icon.svg" width="44" height="44" alt="">Choo Choo Training</div>
  <h1>Hear your child read their <span>first word</span> this week.</h1>
  <div class="free">First 5 lessons free</div>
</div>
<div class="art"><img class="shot" src="../assets/first-track.jpg" alt=""><img class="pip" src="../assets/pip.png" alt=""></div>
